# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '**'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }}, Py-${{ matrix.config.python }}, Torch-${{ matrix.config.torch }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', python: '3.14', torch: '2.12.1'}
          - {os: macOS-latest, r: 'release', python: '3.14', torch: '2.12.1'}
          - {os: ubuntu-24.04, r: 'release', python: '3.14', torch: '2.12.1', rspm: "https://packagemanager.rstudio.com/cran/__linux__/noble/latest"}
          - {os: ubuntu-24.04, r: 'release', python: '3.14', torch: 'latest', rspm: "https://packagemanager.rstudio.com/cran/__linux__/noble/latest"}

    env:
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      CDM5_ORACLE_CDM_SCHEMA: ${{ secrets.CDM5_ORACLE_CDM_SCHEMA }}
      CDM5_ORACLE_OHDSI_SCHEMA: ${{ secrets.CDM5_ORACLE_OHDSI_SCHEMA }}
      CDM5_ORACLE_PASSWORD: ${{ secrets.CDM5_ORACLE_PASSWORD }}
      CDM5_ORACLE_SERVER: ${{ secrets.CDM5_ORACLE_SERVER }}
      CDM5_ORACLE_USER: ${{ secrets.CDM5_ORACLE_USER }}
      CDM5_POSTGRESQL_CDM_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_CDM_SCHEMA }}
      CDM5_POSTGRESQL_OHDSI_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_OHDSI_SCHEMA }}
      CDM5_POSTGRESQL_PASSWORD: ${{ secrets.CDM5_POSTGRESQL_PASSWORD }}
      CDM5_POSTGRESQL_SERVER: ${{ secrets.CDM5_POSTGRESQL_SERVER }}
      CDM5_POSTGRESQL_USER: ${{ secrets.CDM5_POSTGRESQL_USER }}
      CDM5_SQL_SERVER_CDM_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_CDM_SCHEMA }}
      CDM5_SQL_SERVER_OHDSI_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_OHDSI_SCHEMA }}
      CDM5_SQL_SERVER_PASSWORD: ${{ secrets.CDM5_SQL_SERVER_PASSWORD }}
      CDM5_SQL_SERVER_SERVER: ${{ secrets.CDM5_SQL_SERVER_SERVER }}
      CDM5_SQL_SERVER_USER: ${{ secrets.CDM5_SQL_SERVER_USER }}
      UV_SYSTEM_PYTHON: 1
      RETICULATE_USE_MANAGED_VENV: "no"
      DPLP_RUN_PYTHON_TESTS: "true"

    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.config.python }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.config.python }}
        
      - name: Install system requirements
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libssh-dev
          Rscript -e 'install.packages("remotes")'
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "24.04"))')
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::rcmdcheck
          needs: check

      - name: setup r-reticulate venv
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            uv pip install polars tqdm pyarrow "duckdb==1.5.2" nvidia-ml-py numpy
          else
            uv pip install polars tqdm pyarrow duckdb nvidia-ml-py numpy
          fi
          if [ "${{ matrix.config.torch }}" = "latest" ]; then
            uv pip install torch --index https://download.pytorch.org/whl/cpu/
          else
            uv pip install "torch==${{ matrix.config.torch }}" --index https://download.pytorch.org/whl/cpu/
          fi

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'

      - name: Install covr
        if: runner.os == 'Linux'
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Test coverage
        if: runner.os == 'Linux'
        run: covr::codecov(token = "${{ secrets.CODECOV_TOKEN }}")
        shell: Rscript {0}

      - name: Upload source package
        if: success() && runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package_tarball
          path: check/*.tar.gz

  CRAN-check:
    runs-on: ubuntu-24.04

    name: ubuntu-24.04 (R-devel, no Python)

    env:
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/latest
      DPLP_RUN_PYTHON_TESTS: "false"
      RETICULATE_USE_MANAGED_VENV: "no"
      RETICULATE_PYTHON: /does/not/exist
      UV_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX dependencies for the R manual
        run: tlmgr install courier makeindex

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system requirements
        run: |
          sudo apt-get install -y libssh-dev
          Rscript -e 'install.packages("remotes")'
          while read -r cmd
          do
            eval sudo $cmd
          done < <(Rscript -e 'writeLines(remotes::system_requirements("ubuntu", "24.04"))')

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
          check-dir: '"check-cran"'

      - name: Check without suggested packages
        shell: bash
        run: |
          tarball=$(find check-cran -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          mkdir -p check-depends
          _R_CHECK_DEPENDS_ONLY_=true \
            _R_CHECK_FORCE_SUGGESTS_=false \
            R CMD check --no-manual --no-vignettes \
            --output=check-depends "$tarball"

  Release:
    needs: [R-CMD-check, CRAN-check]
    
    runs-on: macOS-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    

      - name: Check if version has increased
        run: |
          echo "new_version="$(perl compare_versions --tag) >> $GITHUB_ENV
          
      - name: Display new version number
        if: ${{ env.new_version != '' }}
        run: |
          echo "${{ env.new_version }}" 
          
      - name: Extract release notes
        if: ${{ env.new_version != '' }}
        id: extract_release_notes
        run: |
          version="${{ env.new_version }}"
          version="${version#v}"
          notes=$(awk -v ver=$version '
          $0=="DeepPatientLevelPrediction "ver {
            getline
            printing=1
            next
          }
          printing && /^DeepPatientLevelPrediction / { exit }
          printing { print }
          ' NEWS.md)
          if [ -z "$notes" ]; then
            echo "ERROR: No release notes found for version $version" >&2
            exit 1
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create release
        if: ${{ env.new_version != '' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} 
        with:
          tag_name: ${{ env.new_version }}
          release_name: Release ${{ env.new_version }}
          body: |
            ${{ steps.extract_release_notes.outputs.notes }}
          draft: false
          prerelease: false
          
      - uses: r-lib/actions/setup-r@v2
        if: ${{ env.new_version != '' }}
        
      - name: Install drat
        if: ${{ env.new_version != '' }}
        run: |
          install.packages('drat')
        shell: Rscript {0}
        
      - name: Remove any tarballs that already exists
        if: ${{ env.new_version != '' }}
        run: |
          rm -f *.tar.gz
          
      - name: Download package tarball
        if: ${{ env.new_version != '' }}
        uses: actions/download-artifact@v5
        with:
          name: package_tarball    
          
      - name: Push to drat
        if: ${{ env.new_version != '' }}
        run: |
          bash deploy.sh

      - name: Push to BroadSea
        if: ${{ env.new_version != '' }}
        run: |
          curl --data "build=true" -X POST https://registry.hub.docker.com/u/ohdsi/broadsea-methodslibrary/trigger/f0b51cec-4027-4781-9383-4b38b42dd4f5/
          
