# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - '**'

name: macOS segfault isolate

jobs:
  isolate:
    runs-on: macOS-latest

    name: ${{ matrix.scenario }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: rcmdcheck-full
            andromeda: current
            filter: ""
          - scenario: rcmdcheck-estimator
            andromeda: current
            filter: "Estimator|estimator"
          - scenario: rcmdcheck-realmlp
            andromeda: current
            filter: "RealMLP"
          - scenario: rcmdcheck-transformer-settings
            andromeda: current
            filter: "Transformer settings work|transformer nn-module works|Errors are produced by settings function|dimHidden ratio works|numerical embedding works"
          - scenario: rcmdcheck-transformer-fit
            andromeda: current
            filter: "fitEstimator with Transformer works|Default Transformer works|temporal transformer works"
          - scenario: rcmdcheck-positional-encodings
            andromeda: current
            filter: "NoPositionalEncoding runs|Additive PEs|Standard Attention PEs|Custom Attention PEs|All PE modules|Methods using dropout"
          - scenario: rcmdcheck-dataset
            andromeda: current
            filter: "number of num|length of dataset|\\.getbatch works|Column order is preserved|feature_ids and feature_values"
          - scenario: rcmdcheck-mlp
            andromeda: current
            filter: "setMultiLayerPerceptron works|MLP with runPlp working checks|MLP nn-module works|Can upload results to database"
          - scenario: rcmdcheck-resnet
            andromeda: current
            filter: "setResNet works|ResNet with runPlp working checks|ResNet nn-module works|Default Resnet works|Can upload results to database"
          - scenario: rcmdcheck-poincare
            andromeda: current
            filter: "Poincare Transformer works|ResNet with poincare works|MLP with poincare works"
          - scenario: rcmdcheck-lr-finder
            andromeda: current
            filter: "LR scheduler that changes per batch works|LR finder works"
          - scenario: rcmdcheck-gradient-accumulation
            andromeda: current
            filter: "Gradient accumulation provides same results|Loss is equal without dropout|LR finder works same|Gradient accumulation works when batch is smaller"

    env:
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      CDM5_ORACLE_CDM_SCHEMA: ${{ secrets.CDM5_ORACLE_CDM_SCHEMA }}
      CDM5_ORACLE_OHDSI_SCHEMA: ${{ secrets.CDM5_ORACLE_OHDSI_SCHEMA }}
      CDM5_ORACLE_PASSWORD: ${{ secrets.CDM5_ORACLE_PASSWORD }}
      CDM5_ORACLE_SERVER: ${{ secrets.CDM5_ORACLE_SERVER }}
      CDM5_ORACLE_USER: ${{ secrets.CDM5_ORACLE_USER }}
      CDM5_POSTGRESQL_CDM_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_CDM_SCHEMA }}
      CDM5_POSTGRESQL_OHDSI_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_OHDSI_SCHEMA }}
      CDM5_POSTGRESQL_PASSWORD: ${{ secrets.CDM5_POSTGRESQL_PASSWORD }}
      CDM5_POSTGRESQL_SERVER: ${{ secrets.CDM5_POSTGRESQL_SERVER }}
      CDM5_POSTGRESQL_USER: ${{ secrets.CDM5_POSTGRESQL_USER }}
      CDM5_SQL_SERVER_CDM_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_CDM_SCHEMA }}
      CDM5_SQL_SERVER_OHDSI_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_OHDSI_SCHEMA }}
      CDM5_SQL_SERVER_PASSWORD: ${{ secrets.CDM5_SQL_SERVER_PASSWORD }}
      CDM5_SQL_SERVER_SERVER: ${{ secrets.CDM5_SQL_SERVER_SERVER }}
      CDM5_SQL_SERVER_USER: ${{ secrets.CDM5_SQL_SERVER_USER }}
      UV_SYSTEM_PYTHON: 1
      RETICULATE_USE_MANAGED_VENV: "no"
      DPLP_TEST_FILTER: ${{ matrix.filter }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Pin Andromeda
        if: ${{ matrix.andromeda != 'current' }}
        shell: Rscript {0}
        run: |
          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes")
          }
          remotes::install_version(
            "Andromeda",
            version = "${{ matrix.andromeda }}",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )

      - name: setup r-reticulate venv
        shell: bash
        run: |
          uv pip install polars tqdm pyarrow duckdb nvidia-ml-py numpy
          uv pip install "torch==2.10.0" --index https://download.pytorch.org/whl/cpu/

      - name: Install package
        if: ${{ !startsWith(matrix.scenario, 'rcmdcheck') }}
        shell: bash
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run scenario
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.scenario }}" in
            rcmdcheck-*)
              Rscript -e 'rcmdcheck::rcmdcheck(".", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")'
              ;;
          esac
