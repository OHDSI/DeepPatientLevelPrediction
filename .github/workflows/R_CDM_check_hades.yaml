# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - '**'

name: macOS segfault isolate

jobs:
  isolate:
    runs-on: macOS-latest

    name: ${{ matrix.scenario }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: rcmdcheck-dataset-current
            andromeda: current
            py_deps: current
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "false"
            skip_teardown: "true"
          - scenario: rcmdcheck-dataset-last-green-pydeps
            andromeda: current
            py_deps: last_green
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "false"
            skip_teardown: "true"
          - scenario: rcmdcheck-dataset-polars-1-40-1
            andromeda: current
            py_deps: old_polars
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "false"
            skip_teardown: "true"
          - scenario: rcmdcheck-dataset-duckdb-1-5-2
            andromeda: current
            py_deps: old_duckdb
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "false"
            skip_teardown: "true"
          - scenario: rcmdcheck-dataset-numpy-2-4-4
            andromeda: current
            py_deps: old_numpy
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "false"
            skip_teardown: "true"
          - scenario: rcmdcheck-dataset-current-finalize-python
            andromeda: current
            py_deps: current
            filter: "Dataset"
            setup_stop: ""
            finalize_python: "true"
            skip_teardown: "true"

    env:
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      CDM5_ORACLE_CDM_SCHEMA: ${{ secrets.CDM5_ORACLE_CDM_SCHEMA }}
      CDM5_ORACLE_OHDSI_SCHEMA: ${{ secrets.CDM5_ORACLE_OHDSI_SCHEMA }}
      CDM5_ORACLE_PASSWORD: ${{ secrets.CDM5_ORACLE_PASSWORD }}
      CDM5_ORACLE_SERVER: ${{ secrets.CDM5_ORACLE_SERVER }}
      CDM5_ORACLE_USER: ${{ secrets.CDM5_ORACLE_USER }}
      CDM5_POSTGRESQL_CDM_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_CDM_SCHEMA }}
      CDM5_POSTGRESQL_OHDSI_SCHEMA: ${{ secrets.CDM5_POSTGRESQL_OHDSI_SCHEMA }}
      CDM5_POSTGRESQL_PASSWORD: ${{ secrets.CDM5_POSTGRESQL_PASSWORD }}
      CDM5_POSTGRESQL_SERVER: ${{ secrets.CDM5_POSTGRESQL_SERVER }}
      CDM5_POSTGRESQL_USER: ${{ secrets.CDM5_POSTGRESQL_USER }}
      CDM5_SQL_SERVER_CDM_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_CDM_SCHEMA }}
      CDM5_SQL_SERVER_OHDSI_SCHEMA: ${{ secrets.CDM5_SQL_SERVER_OHDSI_SCHEMA }}
      CDM5_SQL_SERVER_PASSWORD: ${{ secrets.CDM5_SQL_SERVER_PASSWORD }}
      CDM5_SQL_SERVER_SERVER: ${{ secrets.CDM5_SQL_SERVER_SERVER }}
      CDM5_SQL_SERVER_USER: ${{ secrets.CDM5_SQL_SERVER_USER }}
      UV_SYSTEM_PYTHON: 1
      RETICULATE_USE_MANAGED_VENV: "no"
      DPLP_TEST_FILTER: ${{ matrix.filter }}
      DPLP_SETUP_STOP_AFTER: ${{ matrix.setup_stop }}
      DPLP_FINALIZE_PYTHON: ${{ matrix.finalize_python }}
      DPLP_SKIP_TEST_TEARDOWN: ${{ matrix.skip_teardown }}
      DPLP_PY_DEPS: ${{ matrix.py_deps }}

    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Pin Andromeda
        if: ${{ matrix.andromeda != 'current' }}
        shell: Rscript {0}
        run: |
          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes")
          }
          remotes::install_version(
            "Andromeda",
            version = "${{ matrix.andromeda }}",
            repos = "https://cloud.r-project.org",
            upgrade = "never"
          )

      - name: setup r-reticulate venv
        shell: bash
        run: |
          case "${DPLP_PY_DEPS}" in
            current)
              uv pip install polars tqdm pyarrow duckdb nvidia-ml-py numpy
              ;;
            last_green)
              uv pip install polars==1.40.1 duckdb==1.5.2 numpy==2.4.4 pyarrow==24.0.0 tqdm nvidia-ml-py
              ;;
            old_polars)
              uv pip install polars==1.40.1 tqdm pyarrow duckdb nvidia-ml-py numpy
              ;;
            old_duckdb)
              uv pip install polars tqdm pyarrow duckdb==1.5.2 nvidia-ml-py numpy
              ;;
            old_numpy)
              uv pip install polars tqdm pyarrow duckdb nvidia-ml-py numpy==2.4.4
              ;;
          esac
          uv pip install "torch==2.10.0" --index https://download.pytorch.org/whl/cpu/
          python - <<'PY'
          import duckdb, numpy, polars, pyarrow, torch
          print("python native versions:")
          print("duckdb", duckdb.__version__)
          print("numpy", numpy.__version__)
          print("polars", polars.__version__)
          print("pyarrow", pyarrow.__version__)
          print("torch", torch.__version__)
          PY

      - name: Install package
        if: ${{ !startsWith(matrix.scenario, 'rcmdcheck') }}
        shell: bash
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3

      - name: Run scenario
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.scenario }}" in
            rcmdcheck-*)
              Rscript -e 'rcmdcheck::rcmdcheck(".", args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")'
              ;;
          esac
